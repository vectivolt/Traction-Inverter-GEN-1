<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Traction Inverter GEN-1 animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.55" stop-color="#12263a"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="0.5" stop-color="#f4a261"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <clipPath id="wave-clip"><rect x="0" y="120" width="1200" height="170"/></clipPath>
    <clipPath id="pwm-clip"><rect x="0" y="34" width="1200" height="44"/></clipPath>
    <!-- one seamless 200 px sine period, repeated -->
    <path id="sine" d="M0 0 Q50 -62 100 0 T200 0 T400 0 T600 0 T800 0 T1000 0 T1200 0 T1400 0 T1600 0"
          fill="none" stroke-width="3.2" stroke-linecap="round"/>
    <g id="pulses">
      <g fill="#3a86ff" opacity="0.85">
        <rect x="0"    y="0" width="34" height="30" rx="2"/>
        <rect x="60"   y="0" width="52" height="30" rx="2"/>
        <rect x="140"  y="0" width="26" height="30" rx="2"/>
        <rect x="190"  y="0" width="64" height="30" rx="2"/>
        <rect x="284"  y="0" width="20" height="30" rx="2"/>
        <rect x="330"  y="0" width="58" height="30" rx="2"/>
        <rect x="418"  y="0" width="30" height="30" rx="2"/>
        <rect x="480"  y="0" width="70" height="30" rx="2"/>
        <rect x="586"  y="0" width="22" height="30" rx="2"/>
        <rect x="634"  y="0" width="48" height="30" rx="2"/>
        <rect x="714"  y="0" width="36" height="30" rx="2"/>
        <rect x="778"  y="0" width="62" height="30" rx="2"/>
        <rect x="872"  y="0" width="24" height="30" rx="2"/>
        <rect x="922"  y="0" width="54" height="30" rx="2"/>
        <rect x="1006" y="0" width="30" height="30" rx="2"/>
        <rect x="1062" y="0" width="66" height="30" rx="2"/>
        <rect x="1158" y="0" width="26" height="30" rx="2"/>
        <rect x="1214" y="0" width="50" height="30" rx="2"/>
        <rect x="1294" y="0" width="34" height="30" rx="2"/>
        <rect x="1354" y="0" width="46" height="30" rx="2"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="290" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1e3a55" stroke-width="1" opacity="0.5">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V290M300 0V290M480 0V290M660 0V290M840 0V290M1020 0V290"/>
  </g>

  <!-- PWM gate train (SVPWM-ish), scrolling -->
  <g clip-path="url(#pwm-clip)">
    <g transform="translate(0,42)">
      <use href="#pulses">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="2.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <text x="18" y="30" font-family="Menlo, Consolas, monospace" font-size="11" fill="#3a86ff" opacity="0.9">PWM · 10 kHz · SVPWM</text>
  </g>

  <!-- DC bus rails -->
  <g font-family="Menlo, Consolas, monospace" font-size="11">
    <line x1="0" y1="96" x2="1200" y2="96" stroke="#f4a261" stroke-width="2.4"/>
    <line x1="0" y1="108" x2="1200" y2="108" stroke="#8d99ae" stroke-width="2.4" stroke-dasharray="10 6"/>
    <text x="18" y="92" fill="#f4a261">DCP · 500–850 V</text>
    <text x="1182" y="92" fill="#f4a261" text-anchor="end">320 µF · 116 J</text>
  </g>

  <!-- three-phase output, scrolling; U/V/W phase-shifted by 1/3 wavelength -->
  <g clip-path="url(#wave-clip)">
    <g transform="translate(0,205)">
      <use href="#sine" stroke="#e63946">
        <animateTransform attributeName="transform" type="translate" from="-200 0" to="-400 0" dur="2.6s" repeatCount="indefinite"/>
      </use>
      <use href="#sine" stroke="#2a9d8f">
        <animateTransform attributeName="transform" type="translate" from="-133.3 0" to="-333.3 0" dur="2.6s" repeatCount="indefinite"/>
      </use>
      <use href="#sine" stroke="#3a86ff">
        <animateTransform attributeName="transform" type="translate" from="-66.6 0" to="-266.6 0" dur="2.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="11">
      <text x="18" y="272" fill="#e63946">U</text>
      <text x="34" y="272" fill="#2a9d8f">V</text>
      <text x="50" y="272" fill="#3a86ff">W</text>
      <text x="70" y="272" fill="#8d99ae">· 340 Arms pk · 3× EconoDUAL 3 SiC</text>
      <text x="1182" y="272" fill="#8d99ae" text-anchor="end">ASC · DESAT · FS0B ⌁ safe-state in hardware</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="152" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="6" fill="#f1faee">TRACTION INVERTER <tspan fill="#f4a261">GEN-1</tspan></text>
    <text x="600" y="178" text-anchor="middle" font-size="15" letter-spacing="3" fill="#a8dadc">220 kW PEAK · 800 V · SiC · ASIL-D-CAPABLE · SCHEMATIC-COMPLETE</text>
    <rect x="380" y="188" width="440" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;440;440" keyTimes="0;0.35;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;380;380" keyTimes="0;0.35;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
